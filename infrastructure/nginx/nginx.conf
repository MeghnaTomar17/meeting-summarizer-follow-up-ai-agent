# Nginx reverse proxy — routes public traffic to gateway and static frontend
# TODO: TLS termination, rate limiting, WebSocket support

events {
    worker_connections 1024;
}

http {
    upstream gateway {
        server gateway-service:8000;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # TODO: Serve frontend static assets
        location / {
            return 200 'MannerAI Meetings Platform — nginx placeholder\n';
            add_header Content-Type text/plain;
        }
    }
}
