# Nginx reverse proxy — routes public traffic to gateway-service

events {
    worker_connections 1024;
}

http {
    upstream gateway {
        server gateway-service:8000;
    }

    server {
        listen 80;

        location /health {
            proxy_pass http://gateway/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            # Public API is versioned at /api/v1 on the gateway.
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend static assets will be served here in Phase 6.
        location / {
            return 200 'MannerAI Meetings Platform — API available at /api/v1\n';
            add_header Content-Type text/plain;
        }
    }
}
