# MannerAI Meetings Platform — Docker Compose (placeholder)
# TODO: Wire healthchecks, networks, volumes, and service dependencies.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mannerai_meetings
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mannerai_meetings"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  gateway-service:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  meeting-service:
    build:
      context: .
      dockerfile: infrastructure/docker/meeting.Dockerfile
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  search-service:
    build:
      context: .
      dockerfile: infrastructure/docker/search.Dockerfile
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      qdrant:
        condition: service_started

  worker-service:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-service

volumes:
  postgres_data:
  qdrant_data:
